/* 数据库记录 -> 页面城市对象 */
function recToCity(r){
  const g = k => (r[k]===null||r[k]===undefined) ? "" : String(r[k]);
  const ins = {};
  INSURANCE.forEach(t=>{
    const pre = PREFIX[t.key];
    ins[t.key] = {
      u26:g(pre+"2026上限"), l26:g(pre+"2026下限"), u25:g(pre+"2025上限"), l25:g(pre+"2025下限"),
      comp:g(pre+"公司比例"), pers:g(pre+"个人比例")
    };
  });
  ins.medical.persFixed = g("医疗个人固定");
  return {
    _rid:r._id, name:g("城市省份"), region:g("区域类型"), minWage:g("最低基本工资"), ins,
    publish:g("政策发布时间"), effective:g("生效时间"), docNo:g("公司社保和公积金比例"), notes:g("修改记录"), minSalary:g("最低工资")
  };
}

/* ============== 状态 ============== */
function isCityDone(c){
  return INSURANCE.some(t=>{
    const i=c.ins[t.key];
    return (i.u26&&i.u26!=="")||(i.l26&&i.l26!=="")||(i.comp&&i.comp!=="")||(i.pers&&i.pers!=="");
  });
}
function sortVal(c,f){
  const v=parseFloat(c.ins.pension[f]);
  return isNaN(v)?-1:v;
}

/* ============== 诊断面板 ============== */
function showDiag(title,detail){
  const box=document.getElementById("diag");
  if(!box) return;
  box.style.display="block";
  document.getElementById("diagStatus").textContent=title;
  document.getElementById("diagDetail").textContent=detail;
}

/* ============== 数据加载（优先共享库，失败回退本地备份） ============== */
function sortByFallbackOrder(arr){
  const order={};
  FALLBACK_DATA.forEach(function(c,i){order[c.name]=i;});
  return arr.slice().sort(function(a,b){
    const ia=(order[a.name]!==undefined)?order[a.name]:9999;
    const ib=(order[b.name]!==undefined)?order[b.name]:9999;
    return ia-ib;
  });
}
function loadData(){
  /* 静态镜像：数据已内嵌于 FALLBACK_DATA，不建立任何数据库会话 */
  DATA = FALLBACK_DATA.map(c=>({_rid:"", name:c.name, region:c.region, minWage:c.minWage, ins:c.ins,
    publish:c.publish, effective:c.effective, docNo:c.docNo, notes:c.notes, minSalary:c.minSalary}));
  showDiag("静态镜像 · 已加载 "+DATA.length+" 条记录","数据源：内嵌快照，每周二 10:00 自动更新。");
}

/* ============== 渲染 ============== */
function renderTags(){
  const tagBox=document.getElementById("tags");
  tagBox.innerHTML="";
  const set=new Set();
  FALLBACK_DATA.forEach(c=>set.add(c.region));
  const all=["全部"].concat(Array.from(set));
  all.forEach(r=>{
    const b=document.createElement("button");
    b.className="btn tag"+(curFilter===r?" active":"");
    b.textContent=r;
    b.onclick=function(){curFilter=r;renderTags();renderGrid();};
    tagBox.appendChild(b);
  });
}
function cellHTML(c,t,f,v){
  return '<span class="cell" data-sp-bindable="database" data-sp-database-id="XTIUcLy5mkLWrIvEmPoxxI">'+
    (v&&v!==""?v:'<span class="todo-cell empty">待补充</span>')+'</span>';
}
function renderGrid(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  let list=DATA.slice();
  if(curSearch){ list=list.filter(c=>c.name.indexOf(curSearch)!==-1); }
  if(curFilter!=="全部"){ list=list.filter(c=>c.region===curFilter); }
  if(curSort==="up-desc") list.sort(function(a,b){return sortVal(b,"u26")-sortVal(a,"u26");});
  else if(curSort==="up-asc") list.sort(function(a,b){return sortVal(a,"u26")-sortVal(b,"u26");});
  else if(curSort==="low-desc") list.sort(function(a,b){return sortVal(b,"l26")-sortVal(a,"l26");});
  else if(curSort==="low-asc") list.sort(function(a,b){return sortVal(a,"l26")-sortVal(b,"l26");});
  list.forEach(c=>{
    const done=isCityDone(c);
    const card=document.createElement("div");
    card.className="card";
    let rows="";
    INSURANCE.forEach(t=>{
      const i=c.ins[t.key];
      rows+='<tr>'+
        '<td>'+t.label+'</td>'+
        '<td class="c26">'+cellHTML(c,t.key,"u26",i.u26)+'</td>'+
        '<td class="c26">'+cellHTML(c,t.key,"l26",i.l26)+'</td>'+
        '<td class="c25">'+cellHTML(c,t.key,"u25",i.u25)+'</td>'+
        '<td class="c25">'+cellHTML(c,t.key,"l25",i.l25)+'</td>'+
        '<td>'+cellHTML(c,t.key,"comp",i.comp)+'</td>'+
        '<td>'+cellHTML(c,t.key,"pers",i.pers+(i.persFixed?("+"+i.persFixed):""))+'</td>'+
      '</tr>';
    });
    card.innerHTML =
      '<div class="chead">'+
        '<span class="ttl">'+c.name+'</span>'+
        '<span><span class="badge region">'+c.region+'</span> <span class="badge '+(done?'done':'todo')+'">'+(done?'已确认':'待补充')+'</span></span>'+
      '</div>'+
      '<div class="minwage"><span class="mw-label">最低基本工资（元/月）：</span>'+
        '<span class="cell" data-sp-bindable="database" data-sp-database-id="XTIUcLy5mkLWrIvEmPoxxI">'+(c.minWage&&c.minWage!==""?c.minWage:'<span class="todo-cell empty">待补充</span>')+'</span></div>'+
      '<table>'+

      '<div class="meta">'+
        '<div>政策发布时间：<span class="cell" data-sp-bindable="database" data-sp-database-id="XTIUcLy5mkLWrIvEmPoxxI">'+(c.publish||'<span class="todo-cell empty">待补充</span>')+'</span></div>'+
        '<div>生效时间：<span class="cell" data-sp-bindable="database" data-sp-database-id="XTIUcLy5mkLWrIvEmPoxxI">'+(c.effective||'<span class="todo-cell empty">待补充</span>')+'</span></div>'+
        '<div>公司社保和公积金比例：<span class="cell" data-sp-bindable="database" data-sp-database-id="XTIUcLy5mkLWrIvEmPoxxI">'+(c.docNo||'<span class="todo-cell empty">待补充</span>')+'</span></div>'+
        '<div>最低工资：<span class="cell" data-sp-bindable="database" data-sp-database-id="XTIUcLy5mkLWrIvEmPoxxI">'+(c.minSalary||'<span class="todo-cell empty">待补充</span>')+'</span></div>'+

function showToast(msg){
  const t=document.getElementById("toast");
  if(!t) return;
  t.textContent=msg; t.className="show";
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.className="";},2600);
}

/* ============== CSV 导出 ============== */
function exportCSV(){
  const head=["城市/省份","区域类型","最低基本工资(元/月)","险种","2026上限","2026下限","2025上限","2025下限","公司比例%","个人比例%","政策发布时间","生效时间","公司社保和公积金比例","最低工资","修改记录"];
  const rows=[head];
  DATA.forEach(c=>{
    INSURANCE.forEach(t=>{
      const i=c.ins[t.key];
      rows.push([c.name,c.region,c.minWage,t.label,i.u26,i.l26,i.u25,i.l25,i.comp,i.pers+(i.persFixed?("+"+i.persFixed):""),c.publish,c.effective,c.docNo,c.minSalary,c.notes].map(x=>x===""||x===null?"待补充":x));
    });
  });
  const csv="\ufeff"+rows.map(r=>r.map(v=>{
    const s=String(v);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="2026社保公积金基数速查表.csv";
  a.style.display="none";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 3000);
  /* 兜底：部分环境（iframe 沙箱）会拦截 a.click 下载，自动复制到剪贴板 */
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(csv.replace(/^\ufeff/,"")).then(function(){
        showToast("CSV 已生成："+(DATA.length*INSURANCE.length)+" 行 · 已复制到剪贴板（若未自动下载，请粘贴保存为 .csv）");
      }).catch(function(){});
    }
  }catch(e){}
}

function enforceReadOnly(){
  /* 1. 屏蔽数据库写入 API：即使 SDK 注入 updateRecord 也拒绝执行 */
  try{
    if(window.__SMART_PAGE__ && window.__SMART_PAGE__.database){
      var dbApi=window.__SMART_PAGE__.database;
      if(dbApi.updateRecord){
        dbApi.updateRecord=function(){
          return Promise.reject(new Error("只读镜像：禁止编辑"));
        };
      }
      if(dbApi.addRecord) dbApi.addRecord=function(){ return Promise.reject(new Error("只读镜像：禁止编辑")); };
      if(dbApi.deleteRecord) dbApi.deleteRecord=function(){ return Promise.reject(new Error("只读镜像：禁止编辑")); };
    }
  }catch(e){}
  /* 2. 强制移除所有 contenteditable（防 SDK/脚本注入编辑态） */
  function stripEditable(){
    try{
      var els=document.querySelectorAll('[contenteditable="true"],[contenteditable=""]');
      for(var i=0;i<els.length;i++){ els[i].removeAttribute("contenteditable"); }
    }catch(e){}
  }
  stripEditable();
  /* 3. 监听 DOM 变化：新插入的可编辑元素一律清理 */
  if(window.MutationObserver){
    try{
      new MutationObserver(function(){ stripEditable(); })
        .observe(document.body,{childList:true,subtree:true});
    }catch(e){}
  }
  /* 4. 全局点击拦截：阻止任何进入编辑状态的尝试 */
  document.addEventListener("click",function(e){
    var t=e.target;
    if(t && t.getAttribute && t.getAttribute("data-sp-bindable") && t.hasAttribute("contenteditable")){
      t.removeAttribute("contenteditable");
    }
  },true);
}

/* ============== 初始化 ============== */
function init(){
  enforceReadOnly();
  loadData();
  renderTags();
  renderGrid();
  document.getElementById("search").addEventListener("input",function(e){curSearch=e.target.value.trim();renderGrid();});
  document.querySelectorAll('.sortgrp .btn').forEach(function(b){
    b.addEventListener('click',function(){curSort=b.getAttribute('data-sort');renderGrid();});
  });
  document.getElementById("refreshBtn").addEventListener("click",function(){
    loadData();
  renderTags();
  renderGrid();
    showToast("已刷新");
  });
  document.getElementById("exportBtn").addEventListener("click",exportCSV);
  /* 静态镜像：无数据库轮询，数据为内嵌快照 */
}
init();
</script>
